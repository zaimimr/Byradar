name: hostup-smoke

on:
  push:
    branches:
      - feat/hostup-migration

jobs:
  private-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check Hostup SSH access and household isolation
        run: |
          for attempt in $(seq 1 10); do
            if nc -z -w 3 100.113.84.36 22; then
              break
            fi
            if [ "$attempt" = 10 ]; then
              exit 1
            fi
            sleep 3
          done
          if nc -z -w 5 100.111.44.105 8123; then
            exit 1
          fi
