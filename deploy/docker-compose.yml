name: byradar

x-image: &image
  image: byradar:latest
  platform: linux/amd64
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    platforms:
      - linux/amd64
    args:
      VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:?set VITE_MAPTILER_KEY in deploy/.env}
      VITE_MAPTILER_STYLE: ${VITE_MAPTILER_STYLE:-dataviz-v4-dark}
      VITE_CF_BEACON_TOKEN: ${VITE_CF_BEACON_TOKEN:-6e1643781fb44bbf99c4e882421fcb35}

services:
  server:
    <<: *image
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      TICK_MS: ${TICK_MS:-2000}
      RT_POLL_MS: ${RT_POLL_MS:-30000}
      VM_POLL_MS: ${VM_POLL_MS:-8000}
      ET_CLIENT_NAME: ${ET_CLIENT_NAME:?set ET_CLIENT_NAME in deploy/.env}
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      STRICT_SAME_SITE: ${STRICT_SAME_SITE:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-90}
      MAX_SOCKETS_PER_IP: ${MAX_SOCKETS_PER_IP:-20}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      FEEDBACK_WEBHOOK_URL: ${FEEDBACK_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=640
    volumes:
      - data:/app/data
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 896M

  pipeline:
    <<: *image
    profiles:
      - tools
    command: ["npm", "run", "-w", "@byradar/pipeline", "start"]
    environment:
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - data:/app/data
      - cache:/app/.cache
    deploy:
      resources:
        limits:
          memory: 1700M

  caddy:
    image: caddy:2.8-alpine
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    ports:
      - "${PUBLIC_BIND_IP:-0.0.0.0}:80:80"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:443:443"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  data:
  cache:
  caddy_data:
  caddy_config:
