<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Byradar · sanntidskart for kollektivtrafikken i Oslo</title>
    <meta
      name="description"
      content="Se T-bane, trikk, buss, båt og tog bevege seg i Oslo i sanntid. Følg en avgang, søk opp en linje, og se når det går fra stoppet nærmest deg."
    />
    <link rel="canonical" href="https://byradar.no/" />
    <meta name="theme-color" content="#07090c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Byradar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Byradar" />
    <meta property="og:locale" content="nb_NO" />
    <meta property="og:url" content="https://byradar.no/" />
    <meta property="og:title" content="Byradar · sanntidskart for kollektivtrafikken i Oslo" />
    <meta
      property="og:description"
      content="Se T-bane, trikk, buss, båt og tog bevege seg i Oslo i sanntid."
    />
    <meta property="og:image" content="https://byradar.no/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mørkt kart over Oslo med farget kollektivnett og hundrevis av kjøretøy i bevegelse."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Byradar · sanntidskart for kollektivtrafikken i Oslo" />
    <meta
      name="twitter:description"
      content="Se T-bane, trikk, buss, båt og tog bevege seg i Oslo i sanntid."
    />
    <meta name="twitter:image" content="https://byradar.no/og.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Byradar",
        "url": "https://byradar.no/",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "inLanguage": "nb-NO",
        "description": "Sanntidskart over kollektivtrafikken i Oslo: T-bane, trikk, buss, båt og tog.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NOK" },
        "author": { "@type": "Person", "name": "Zaim Imran", "url": "https://zaim.no" },
        "areaServed": { "@type": "City", "name": "Oslo" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Martian+Mono:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="map" aria-hidden="true"></div>

    <svg class="grain" aria-hidden="true">
      <filter id="grain-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#grain-filter)" />
    </svg>

    <main class="chrome">
      <header class="masthead" data-reveal="1">
        <div class="masthead__mark" aria-hidden="true">
          <span class="masthead__bar" style="--c: #ec700c"></span>
          <span class="masthead__bar" style="--c: #0b91ef"></span>
          <span class="masthead__bar" style="--c: #e60000"></span>
          <span class="masthead__bar" style="--c: #354f7f"></span>
        </div>
        <div class="masthead__text">
          <h1>Byradar</h1>
          <p class="masthead__sub" id="masthead-sub">kobler til&hellip;</p>
        </div>
      </header>

      <section class="search" id="search" data-reveal="2">
        <div class="search__field">
          <label class="search__label" for="search-input">søk</label>
          <input
            class="search__input"
            id="search-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="linje eller stopp"
            aria-label="Søk etter linje eller stopp"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-results"
            aria-autocomplete="list"
          />
          <kbd class="search__key" aria-hidden="true">/</kbd>
        </div>
        <div class="search__filter" id="search-filter" hidden></div>
        <div class="search__results" id="search-results" role="listbox" aria-label="Treff" hidden></div>
      </section>

      <nav class="rail" id="mode-rail" aria-label="Transportmidler" data-reveal="3"></nav>

      <section class="legend" id="legend" data-reveal="5">
        <h2 class="legend__title">Presisjon</h2>
        <ul class="legend__scale" id="legend-scale"></ul>
        <h2 class="legend__title legend__title--spaced">Kilde</h2>
        <ul class="legend__sources">
          <li><span class="prov prov--gps">GPS</span> faktisk posisjon fra kjøretøyet</li>
          <li><span class="prov prov--est">EST</span> beregnet fra rute + sanntidsavvik</li>
        </ul>
        <p class="legend__note" id="legend-note"></p>
      </section>

      <aside class="status" id="status" data-reveal="4">
        <div class="status__clock" id="clock">--:--:--</div>
        <dl class="status__grid">
          <div><dt>i trafikk</dt><dd id="stat-active">–</dd></div>
          <div><dt>gps</dt><dd id="stat-gps">–</dd></div>
          <div><dt>sanntid</dt><dd id="stat-rt">–</dd></div>
          <div><dt>snitt avvik</dt><dd id="stat-delay">–</dd></div>
        </dl>
        <div class="status__link" id="conn"><span class="dot"></span><span id="conn-label">frakoblet</span></div>
      </aside>

      <section class="pulse" id="pulse" data-reveal="6">
        <div class="pulse__track" id="pulse-track"></div>
        <div class="pulse__axis">
          <span id="pulse-caption">byens puls</span>
          <span id="pulse-total"></span>
        </div>
      </section>

      <section class="inspector" id="inspector" aria-live="polite" data-sheet="full" hidden>
        <button class="inspector__grip" id="inspector-grip" type="button" aria-label="Vis mer eller mindre"></button>
        <button class="inspector__close" id="inspector-close" type="button" aria-label="Lukk">&times;</button>
        <div id="inspector-body"></div>
      </section>

      <div class="attrib">
        <a class="attrib__om" href="/om">om byradar</a>
      </div>

      <details class="filters" id="filters" data-reveal="5">
        <summary class="filters__handle" title="Filtre">
          <svg class="filters__glyph" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              d="M1.8 4h12.4M4 8h8M6.4 12h3.2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <span class="filters__handle-label">filtre</span>
          <span class="filters__handle-dot" id="filters-dot" hidden></span>
        </summary>
        <div class="filters__sheet">
          <div class="filters__rows" id="filters-body"></div>
          <p class="filters__summary" id="filters-summary" role="status" hidden></p>
          <button class="filters__reset" id="filters-reset" type="button" disabled>nullstill</button>
        </div>
      </details>
    </main>

    <noscript>
      <div class="noscript">
        <h2>Byradar trenger JavaScript</h2>
        <p>
          Byradar er et sanntidskart over kollektivtrafikken i Oslo. Det tegner T-bane, trikk, buss, båt og tog mens
          de kjører, med avgangstider fra stoppene rundt deg. Kartet krever JavaScript for å tegne seg.
        </p>
        <p><a href="/om">Les om hvor dataene kommer fra og hvor nøyaktige de er</a>.</p>
      </div>
    </noscript>

    <div class="boot" id="boot">
      <div class="boot__inner">
        <div class="boot__bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <p id="boot-label">laster nettverket</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
